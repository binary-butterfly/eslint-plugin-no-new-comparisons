name: release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - uses: JS-DevTools/npm-publish@v4.1.5
        with:
          token: ${{ secrets.NPM_TOKEN }}
